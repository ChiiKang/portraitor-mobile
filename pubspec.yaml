name: portraitor_mobile
description: Portraitor - AI personality portrait from chat exports
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.8.0
  riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  path: ^1.9.1
  connectivity_plus: ^6.1.4
  uuid: ^4.5.1
  receive_sharing_intent: ^1.8.1
  archive: ^4.0.4
  file_picker: ^9.2.2
  google_fonts: ^6.2.1
  video_player: ^2.9.2
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.3.0
  smooth_page_indicator: ^1.2.0+3
  shimmer: ^3.0.0
  intl: ^0.19.0
  crypto: ^3.0.6
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.0
  in_app_purchase_storekit: ^0.4.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
  assets:
    - assets/images/
    - assets/brand/portraitor-logo.png
    - docs/handover_mobile_01-04/assets/01-welcome-bg.png
    - docs/handover_mobile_01-04/assets/02-howitworks-bg.png
    - docs/handover_mobile_01-04/assets/03-privacy-bg.png
    - docs/handover_mobile_01-04/assets/04-home-card-bg.png
