name: portraitor_mobile
description: Portraitor - AI personality portrait from chat exports
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.8.0
  dio_smart_retry: ^7.0.1
  flutter_stripe: ^11.4.0
  riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  path: ^1.9.1
  connectivity_plus: ^6.1.4
  flutter_local_notifications: ^19.0.0
  flutter_markdown: ^0.7.7
  uuid: ^4.5.1
  receive_sharing_intent: ^1.8.1
  archive: ^4.0.4
  flutter_foreground_task: ^9.2.2
  file_picker: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
